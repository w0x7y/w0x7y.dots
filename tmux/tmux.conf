set -g mouse off
set -g history-limit 50000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g display-time 2000
set -g mode-keys vi
set -g focus-events on
set -g set-clipboard on
# kitty images (icat, yazi)
set -g allow-passthrough on
# Keeps kitty's replies to snacks.nvim from leaking into nvim as keystrokes
set -s extended-keys on
set -as terminal-features "xterm-kitty:extkeys"

bind r source-file ~/.config/tmux/tmux.conf
bind -n M-Left select-pane -L
bind -n M-Down select-pane -D
bind -n M-Up select-pane -U
bind -n M-Right select-pane -R
bind -n M-n new-window -c "#{pane_current_path}"
bind -n 'M-\' split-window -h -c "#{pane_current_path}"
bind -n M-- split-window -v -c "#{pane_current_path}"
bind -n M-z resize-pane -Z
bind -n M-x kill-pane
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9

source-file ~/.config/tmux/rime.conf

# Rime overrides; keep rime.conf stock so it can be updated
set -g status-position top
set -g status-style bg=default
set -g status-left ""
set -g status-right "#[fg=#7aa4e4]%d-%b %H:%M "
set -g window-status-separator ""
set -g window-status-format " #I #W#{?window_zoomed_flag, 󰊓,} "
set -g window-status-current-format " #I #W#{?window_zoomed_flag, 󰊓,} "
set -g window-status-current-style fg=#7aa4e4
